name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the tag matches the package version
        env:
          REF: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./package.json').version")
          EXPECTED="v${PACKAGE}"
          if [ "$REF" != "$EXPECTED" ]; then
            echo "::error title=Version mismatch::Tag $REF does not match package.json version $PACKAGE"
            exit 1
          fi
          echo "publishing ${PACKAGE}"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
